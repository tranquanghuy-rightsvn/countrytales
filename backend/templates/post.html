<!doctype html>
<html lang="vi">
<head>
{{ANALYTICS_TAG}}
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="robots" content="index,follow">
    <link rel="canonical" href="{{URL}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="{{SITE_NAME}}">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{URL}}">
{{OG_IMAGE_TAG}}
{{FAVICON_TAG}}
    <meta property="article:published_time" content="{{PUBLISHED_ISO}}">
    <link rel="stylesheet" type="text/css" href="/css/roboto.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/noto-serif.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/main.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/footer.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/article.css?v=2">
    <link rel="stylesheet" type="text/css" href="/css/custom.css?v=2">
    <script type="application/ld+json">
{{JSON_LD}}
    </script>
</head>
<body id="page-article" class="refresh">
{{HEADER}}
    <div class="page-wrapper">
        <article class="the-article">
            <header class="the-article-header">
                <p class="the-article-category"><a href="{{CATEGORY_URL}}" title="{{CATEGORY_NAME}}">{{CATEGORY_NAME}}</a></p>
                <h1 class="the-article-title">{{TITLE}}</h1>
                <ul class="the-article-meta">
                    <li class="the-article-publish">{{DATE_DISPLAY}}</li>
                </ul>
            </header>
            <section class="main">
                <div class="the-article-body">
{{CONTENT}}
                </div>
            </section>
        </article>
    </div>
{{RELATED_SECTION}}
{{FOOTER}}
</body>
</html>
